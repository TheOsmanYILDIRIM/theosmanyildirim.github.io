name: Deploy Java-to-Bedrock texture converter

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/deploy-texture-converter.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-texture-converter
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Pages repository
        uses: actions/checkout@v4
        with:
          path: site
          ref: master
          fetch-depth: 0

      - name: Checkout converter web app
        uses: actions/checkout@v4
        with:
          repository: TheOsmanYILDIRIM/ConvertJavaTextureToBedrock
          ref: 0e526a2a032728e85f780e27309fe90c557a0e57
          path: web
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install converter dependencies
        working-directory: web
        run: yarn install --ignore-engines

      - name: Build converter
        working-directory: web
        env:
          NODE_OPTIONS: --openssl-legacy-provider
        run: yarn build

      - name: Verify converter bundle
        run: |
          test -f web/build/index.html
          grep -q "Java 26.3 conversions enabled" web/build/index.html
          worker_count="$(find web/build -maxdepth 1 -name 'worker.*.js' | wc -l)"
          test "$worker_count" -ge 1
          grep -R -q "Custom Java block models detected" web/build/worker.*.js
          grep -R -q "j2b_companion/blocks/" web/build/worker.*.js

      - name: Publish under existing Pages site
        run: |
          rm -rf site/converter
          mkdir -p site/converter
          cp -a web/build/. site/converter/
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add converter
          if git diff --cached --quiet; then
            echo "Converter bundle unchanged."
            exit 0
          fi
          git commit -m "deploy: update Java-to-Bedrock converter"
          git push origin HEAD:master

      - name: Verify live converter route
        run: |
          url="https://theosmanyildirim.github.io/converter/"
          ok=0
          for attempt in 1 2 3 4 5 6 7 8; do
            code="$(curl -L -sS -o /tmp/converter.html -w '%{http_code}' "$url" || true)"
            echo "attempt=$attempt status=$code"
            if [ "$code" = "200" ] && grep -q "Java 26.3 conversions enabled" /tmp/converter.html; then
              ok=1
              break
            fi
            sleep 15
          done
          test "$ok" = "1"
          echo "Live converter verified: $url"

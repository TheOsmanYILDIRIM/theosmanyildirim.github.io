name: YouTube subagent research

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/youtube-subagent-research-20261018
    paths:
      - '.github/workflows/youtube-subagent-research.yml'
      - 'tools/youtube_agents/**'
      - 'skills/efficient-subagent-orchestration/**'

permissions:
  contents: read

concurrency:
  group: youtube-subagent-research
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact tested branch
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Deno for YouTube JavaScript challenges
        uses: denoland/setup-deno@v2
        with:
          deno-version: 'v2.x'
      - name: Install yt-dlp and bundled EJS scripts
        run: python -m pip install 'yt-dlp[default]>=2025.1,<2028'
      - name: Prepare optional YouTube cookies securely
        id: cookies
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$YOUTUBE_COOKIES" ]]; then
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo 'YOUTUBE_COOKIES secret unavailable; running unauthenticated.'
            exit 0
          fi
          umask 077
          COOKIE_FILE="$RUNNER_TEMP/youtube-session-cookies.txt"
          printf '%s\n' "$YOUTUBE_COOKIES" > "$COOKIE_FILE"
          unset YOUTUBE_COOKIES
          if ! head -n 1 "$COOKIE_FILE" | grep -Eq '^# (Netscape HTTP Cookie File|HTTP Cookie File)'; then
            echo 'Invalid Netscape cookies header; stopping without exposing contents.' >&2
            exit 1
          fi
          echo "YTDLP_COOKIE_FILE=$COOKIE_FILE" >> "$GITHUB_ENV"
          echo 'configured=true' >> "$GITHUB_OUTPUT"
      - name: Probe Forn AI video with real extractor (diagnostic)
        id: youtube_probe
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          args=(--no-playlist --list-subs)
          if [[ -n "${YTDLP_COOKIE_FILE:-}" ]]; then
            args+=(--cookies "$YTDLP_COOKIE_FILE")
          fi
          python -m yt_dlp "${args[@]}" 'https://www.youtube.com/watch?v=3RcSsjTgnhI' >/dev/null 2>&1
      - name: Execute collector unit tests
        run: python -m unittest discover -s tools/youtube_agents/tests -v
      - name: Find Forn AI and Avenox agent videos and fetch captions
        if: steps.youtube_probe.outcome == 'success'
        run: |
          python tools/youtube_agents/collect.py \
            --output output/youtube-agents \
            --scan-descriptions \
            --max-captions 0 \
            --timeout 120 \
            --metadata-timeout 50
      - name: Require YouTube video access for research acceptance
        if: steps.youtube_probe.outcome == 'failure'
        run: |
          echo 'BLOCKED: YouTube video extraction unavailable; no transcript success is claimed.' >&2
          exit 4
      - name: Remove temporary authentication cookies
        if: always()
        shell: bash
        run: |
          if [[ -n "${YTDLP_COOKIE_FILE:-}" ]]; then
            rm -f -- "$YTDLP_COOKIE_FILE"
          fi
      - name: Preserve real inventory, captions and blockers as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-subagent-research
          path: output/youtube-agents/
          if-no-files-found: warn
          retention-days: 3

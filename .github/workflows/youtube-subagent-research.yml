name: YouTube subagent research

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/youtube-subagent-research-20261018
    paths:
      - '.github/workflows/youtube-subagent-research.yml'
      - 'tools/youtube_agents/**'
      - 'skills/efficient-subagent-orchestration/**'
  pull_request:
    paths:
      - '.github/workflows/youtube-subagent-research.yml'
      - 'tools/youtube_agents/**'
      - 'skills/efficient-subagent-orchestration/**'

permissions:
  contents: read

concurrency:
  group: youtube-subagent-research
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact tested branch
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Deno for YouTube JavaScript challenges
        uses: denoland/setup-deno@v2
        with:
          deno-version: 'v2.x'
      - name: Install yt-dlp and bundled EJS scripts
        run: python -m pip install 'yt-dlp[default]>=2025.1,<2028'
      - name: Probe verified Forn AI video with actual subtitle extractor
        shell: bash
        run: |
          set -o pipefail
          python -m yt_dlp --verbose --no-playlist --list-subs 'https://www.youtube.com/watch?v=3RcSsjTgnhI' 2>&1 | tail -65
      - name: Execute collector unit tests
        run: python -m unittest discover -s tools/youtube_agents/tests -v
      - name: Find Forn AI and Avenox agent videos and fetch captions
        run: |
          python tools/youtube_agents/collect.py \
            --output output/youtube-agents \
            --scan-descriptions \
            --max-captions 0 \
            --timeout 120 \
            --metadata-timeout 50
      - name: Preserve real inventory, captions and blockers as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-subagent-research
          path: output/youtube-agents/
          if-no-files-found: warn
          retention-days: 3
